<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <title>Dados Rápidos</title>
</head>
<body>
  <header>
    <h1>Dados Rápidos — Atendimento Fácil Assist</h1>
  </header>

  <main>
    <div class="campo">
      <label for="nome">Nome:</label>
      <input type="text" id="nome">
      <button class="btn-copiar" data-alvo="nome">Copiar</button>
    </div>

    <div class="campo">
      <label for="placa">Placa do veículo:</label>
      <input type="text" id="placa">
      <button class="btn-copiar" data-alvo="placa">Copiar</button>
    </div>

    <div class="campo">
      <label for="endereco_origem">Endereço de origem:</label>
      <input type="text" id="endereco_origem">
      <button class="btn-copiar" data-alvo="endereco_origem">Copiar</button>
    </div>

    <div class="campo">
      <label for="endereco_destino">Endereço de destino:</label>
      <input type="text" id="endereco_destino">
      <button class="btn-copiar" data-alvo="endereco_destino">Copiar</button>
    </div>

    <div class="campo">
      <label for="motivo">Motivo da ligação:</label>
      <input type="text" id="motivo">
      <button class="btn-copiar" data-alvo="motivo">Copiar</button>
    </div>

    <div class="campo">
      <label for="detalhes">Detalhes:</label>
      <input type="text" id="detalhes">
      <button class="btn-copiar" data-alvo="detalhes">Copiar</button>
    </div>

    <button id="btn-limpar">Resetar dados</button>
  </main>
</body>
</html>
